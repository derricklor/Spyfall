version: '3.8'

services:
  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/spyfall_db
      CORS_ORIGIN: http://localhost:5173 # Change this to your frontend's production URL
    depends_on:
      - mongo
    networks:
      - spyfall-net

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - spyfall-net

networks:
  spyfall-net:
    driver: bridge

volumes:
  mongo-data:
